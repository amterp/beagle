kan_schema = "board/12"
id = "b_1aeAmFSc0"
name = "main"
default_column = "backlog"

[[columns]]
  name = "backlog"
  color = "#6b7280"
  description = "Planned work not yet started"
  limit = 0

[[columns]]
  name = "next"
  color = "#3b82f6"
  description = "Ready to be picked up next"
  limit = 5

[[columns]]
  name = "in-progress"
  color = "#f59e0b"
  description = "Currently being worked on"
  limit = 5

[[columns]]
  name = "done"
  color = "#10b981"
  description = "Completed work"
  limit = 0

[custom_fields]
  [custom_fields.type]
    type = "enum"
    wanted = true
    description = "The category of work this card represents"

    [[custom_fields.type.options]]
      value = "bug"
      color = "#dc2626"
      description = "A defect in existing functionality"

    [[custom_fields.type.options]]
      value = "enhancement"
      color = "#2563eb"
      description = "An improvement to existing functionality"

    [[custom_fields.type.options]]
      value = "feature"
      color = "#16a34a"
      description = "New functionality to be added"

    [[custom_fields.type.options]]
      value = "chore"
      color = "#4b5563"
      description = "Maintenance, refactoring, or housekeeping"

[card_display]
  type_indicator = "type"

[[pattern_hooks]]
name = "type-shortcut"
pattern_title = "![a-zA-Z]+"
command = ".kan/hooks/type-shortcut.rad"
